spring.application.name=bbb
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/form_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# show SQL
spring.jpa.show-sql=true

# log câu SQL Hibernate generate
logging.level.org.hibernate.SQL=DEBUG

# log giá trị param (quan trọng nhất)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# với Hibernate 6 (Spring Boot 3)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# log transaction
logging.level.org.springframework.transaction=DEBUG

# log JPA
logging.level.org.springframework.orm.jpa=DEBUG